name: Update Football and UFC Strategies

on:
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * *'

permissions:
  contents: write

concurrency:
  group: value-methods-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Refresh official UFC data and scan both methods
        id: refresh
        run: python scripts/refresh_value_methods.py
      - name: Publish portable public data and status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/value_methods/ufc.json models/value_methods/ufc_history.csv.gz models/value_methods/automation_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh football and UFC strategy data'
            git push
          fi
